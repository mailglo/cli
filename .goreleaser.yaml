# GoReleaser v2 configuration. Release builds run in .github/workflows/release.yml.
version: 2

project_name: mailglo

before:
  hooks:
    - go mod tidy -diff
    - go test ./...

builds:
  - id: mailglo
    main: ./cmd/mailglo
    binary: mailglo
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mailglo
    ids: [mailglo]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The binaries include the Go runtime, the standard library and the
    # modules listed in NOTICE; their licences must accompany them.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - licenses/**/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Signs and notarizes the macOS binaries with the Developer ID certificate.
# It runs only when the signing and notary secrets are present, so forks and
# snapshot builds still build.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD") (isEnvSet "MACOS_NOTARY_KEY") (isEnvSet "MACOS_NOTARY_KEY_ID") (isEnvSet "MACOS_NOTARY_ISSUER_ID") }}'
      ids: [mailglo]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

homebrew_casks:
  - name: mailglo
    ids: [mailglo]
    binaries: [mailglo]
    homepage: https://mailglo.com
    description: Command-line client for the Mailglo API
    license: Apache-2.0
    repository:
      owner: mailglo
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "mailglo {{ .Tag }}"
    # Prereleases do not update the tap; without the token nothing is pushed.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'

release:
  github:
    owner: mailglo
    name: cli
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
